name: Build Zombie Outbreak APK
on:
  push:
    branches: ['feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify SDK and install platform if missing
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify JavaScript syntax and run smoke tests
        run: |
          node --check app/src/main/assets/game.js
          node test/smoke.cjs
          node test/regression.cjs
      - name: Build debug and minified release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Test-sign optimized release
        run: |
          keytool -genkeypair -v -keystore /tmp/outbreak-test.keystore -alias outbreak -keyalg RSA -keysize 2048 -validity 3650 -storepass android123 -keypass android123 -dname 'CN=OUTBREAK Test,O=Prototype,C=US'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/outbreak-test.keystore --ks-key-alias outbreak --ks-pass pass:android123 --key-pass pass:android123 --out app/build/outputs/apk/release/OUTBREAK-v0.4-optimized-test.apk /tmp/app-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/OUTBREAK-v0.4-optimized-test.apk
      - name: Verify files
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/OUTBREAK-v0.4-optimized-test.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: OUTBREAK-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OUTBREAK-optimized-test-APK
          path: app/build/outputs/apk/release/OUTBREAK-v0.4-optimized-test.apk
          if-no-files-found: error
